[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-machine-kdenlive"
version = "0.1.0"
description = "Local-first video transcription, subtitle generation, and Kdenlive project tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "subtitle-machine-kdenlive contributors" },
]
dependencies = [
  "PyYAML>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[project.scripts]
video-mcp = "video_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
