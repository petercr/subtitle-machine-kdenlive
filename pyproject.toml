[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-machine-kdenlive"
version = "0.1.0"
description = "Local-first video transcription, subtitle generation, and Kdenlive project tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "subtitle-machine-kdenlive contributors" },
]
dependencies = [
  "mcp[cli]>=2.0.0",
  "PyYAML>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/video_mcp/subtitles/__init__.py" = ["E402"]
"tests/test_parakeet.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[project.scripts]
video-mcp = "video_mcp.cli:main"
video-mcp-server = "video_mcp.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
